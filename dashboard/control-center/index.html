<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVICS Executive Command Workspace</title>
    <meta name="evics-workspace-build" content="2026-08-01T18:40:00Z" />
    <meta name="description" content="EVICS executive command workspace with live operational monitors." />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="media-output.css" />
    <link rel="stylesheet" href="vp-executive-assistant.css" />
    <style>
      #evics-boot-splash {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 60vh; color: #eff5fb; gap: 18px; padding: 40px;
      }
      #evics-boot-splash .splash-logo {
        display: grid; place-items: center; width: 56px; height: 56px; border-radius: 10px;
        background: linear-gradient(135deg, #f0d898 0%, #d9bf7a 55%, #9a7a32 100%);
        color: #070b11; font-weight: 900; font-size: 18px; letter-spacing: -0.5px;
        box-shadow: 0 0 22px rgba(217,191,122,.3);
      }
      #evics-boot-splash .splash-title { font-size: 18px; font-weight: 700; color: #eff5fb; }
      #evics-boot-splash .splash-sub { font-size: 12px; color: #90a4bb; letter-spacing: 0.08em; text-transform: uppercase; }
      #evics-boot-splash .splash-spinner {
        width: 28px; height: 28px; border: 3px solid rgba(0,199,245,.15);
        border-top-color: #00c7f5; border-radius: 50%; animation: evics-spin 0.8s linear infinite;
      }
      @keyframes evics-spin { to { transform: rotate(360deg); } }
      #evics-diag-panel {
        display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999999;
        background: #1a1a2e; color: #0f0; font-family: monospace; font-size: 12px;
        padding: 16px; max-height: 70vh; overflow: auto; border-bottom: 3px solid #ff5a68;
      }
      #evics-diag-panel h3 { color: #ff5a68; margin: 0 0 8px; font-size: 14px; }
    </style>
  </head>
  <body class="exec-shell-body">
    <!-- Global error capture + render diagnostics -->
    <script>
      window.__evicsBootErrors = [];
      window.__evicsDiag = [];
      window.__evicsDiagLog = function(msg) {
        window.__evicsDiag.push('[' + new Date().toISOString().slice(11,19) + '] ' + msg);
      };
      window.onerror = function (msg, src, line, col, err) {
        window.__evicsBootErrors.push({ msg: msg, src: src, line: line, col: col });
        window.__evicsDiagLog('ONERROR: ' + msg + ' at ' + src + ':' + line);
      };
    </script>

    <header class="exec-shell-header">
      <div class="exec-shell-brand">
        <span class="exec-mark">EVICS</span>
        <div>
          <strong>I AM GENESIS TECH</strong>
          <small>ELITE VIRAL INTELLIGENCE CONTROL SYSTEM</small>
        </div>
      </div>
      <nav class="exec-shell-nav">
        <a href="/workspace" aria-current="page">EVICS</a>
        <a href="/viral-media">Viral Media</a>
        <a href="/affiliate">Affiliate Hub</a>
        <a href="/phone-app">Phone App</a>
        <a href="/admin-hub">Affiliate AdminHub</a>
        <a href="/discoverability">SEO Grader</a>
      </nav>
      <div class="exec-shell-pulse" id="evicsPulse">Initializing live monitors…</div>
    </header>

    <main class="exec-shell-main">
      <div id="evics-boot-splash">
        <div class="splash-logo">EVICS</div>
        <div class="splash-title">I AM GENESIS TECH</div>
        <div class="splash-sub">Elite Viral Intelligence Control System</div>
        <div class="splash-spinner"></div>
        <div class="splash-sub" id="evics-boot-status">Loading workspace…</div>
      </div>
      <div id="evics-diag-panel"><h3>EVICS Boot Diagnostic</h3><pre id="evics-diag-log">Waiting for scripts...</pre></div>
      <div id="app"></div>
    </main>

    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="media-output.js"></script>
    <script src="workspace-boot-shims.js"></script>
    <script>window.__evicsDiagLog('Pre-app.js: about to load app.js');</script>
    <script src="app.js"></script>
    <script>
      // THIS RUNS IMMEDIATELY AFTER app.js — capture the state
      window.__evicsDiagLog('Post-app.js loaded');
      window.__evicsDiagLog('render type: ' + typeof render);
      window.__evicsDiagLog('boot type: ' + typeof boot);
      window.__evicsDiagLog('renderWorkspaceShell type: ' + typeof renderWorkspaceShell);
      window.__evicsDiagLog('bindEvents type: ' + typeof bindEvents);
      window.__evicsDiagLog('__evicsRenderers: ' + (window.__evicsRenderers ? Object.keys(window.__evicsRenderers).join(',') : 'NOT SET'));
      window.__evicsDiagLog('state type: ' + typeof state);
      if (typeof state !== 'undefined') {
        window.__evicsDiagLog('state.dataSource: ' + state.dataSource);
        window.__evicsDiagLog('state.currentSection: ' + state.currentSection);
      }
      var _diagApp = document.getElementById('app');
      window.__evicsDiagLog('app innerHTML length: ' + (_diagApp ? _diagApp.innerHTML.length : 'NO APP'));
      window.__evicsDiagLog('app children: ' + (_diagApp ? _diagApp.children.length : 'NO APP'));
      window.__evicsDiagLog('Boot errors so far: ' + window.__evicsBootErrors.length);
      if (window.__evicsBootErrors.length > 0) {
        window.__evicsBootErrors.forEach(function(e) {
          window.__evicsDiagLog('  ERR: ' + e.msg + ' @ ' + e.src + ':' + e.line);
        });
      }
    </script>
    <script src="workspace-boot-fix.js"></script>
    <script src="vp-executive-assistant.js"></script>
    <script src="vp-board-command-guard.js"></script>
    <script>
      (function () {
        var pulse = document.getElementById('evicsPulse');
        var splash = document.getElementById('evics-boot-splash');
        var bootStatus = document.getElementById('evics-boot-status');
        var diagPanel = document.getElementById('evics-diag-panel');
        var diagLog = document.getElementById('evics-diag-log');

        function showDiag() {
          if (diagPanel && diagLog) {
            diagPanel.style.display = 'block';
            diagLog.textContent = window.__evicsDiag.join('\n');
            if (splash) splash.style.display = 'none';
          }
        }

        function checkAppMounted() {
          var app = document.getElementById('app');
          if (app && app.children.length > 0) {
            if (splash) splash.style.display = 'none';
            return true;
          }
          return false;
        }

        var mountCheck = setInterval(function () {
          if (checkAppMounted()) clearInterval(mountCheck);
        }, 100);

        // After 5 seconds: if app is still empty, FORCE show diagnostics
        setTimeout(function () {
          if (!checkAppMounted()) {
            window.__evicsDiagLog('5s TIMEOUT: app still empty');
            window.__evicsDiagLog('Products: ' + (typeof products !== 'undefined' ? products.length : '?'));
            window.__evicsDiagLog('viralAds: ' + (typeof viralAds !== 'undefined' ? viralAds.length : '?'));
            window.__evicsDiagLog('Renderers: ' + (window.__evicsRenderers ? Object.keys(window.__evicsRenderers).length : 'none'));

            // Try calling renderWorkspaceShell directly
            try {
              if (typeof renderWorkspaceShell === 'function') {
                var html = renderWorkspaceShell();
                window.__evicsDiagLog('renderWorkspaceShell returned: ' + (html ? html.length + ' chars' : 'empty'));
                if (html && html.length > 100) {
                  var appEl = document.getElementById('app');
                  appEl.innerHTML = html;
                  window.__evicsDiagLog('Injected HTML into app');
                  if (typeof bindEvents === 'function') { bindEvents(); window.__evicsDiagLog('bindEvents OK'); }
                  if (splash) splash.style.display = 'none';
                  return; // Success!
                }
              }
            } catch (e) {
              window.__evicsDiagLog('renderWorkspaceShell ERROR: ' + e.message);
            }

            // Try calling render directly
            try {
              if (typeof render === 'function') {
                window.__evicsDiagLog('Trying render()...');
                render();
                var appEl2 = document.getElementById('app');
                window.__evicsDiagLog('After render: app length = ' + (appEl2 ? appEl2.innerHTML.length : '?'));
              }
            } catch (e) {
              window.__evicsDiagLog('render() ERROR: ' + e.message);
            }

            // Show the diagnostic panel
            showDiag();
          }
        }, 5000);

        // After 15s: always show diagnostics if app empty
        setTimeout(function () {
          if (!checkAppMounted()) {
            window.__evicsDiagLog('15s: still no content');
            showDiag();
          }
        }, 15000);

        function refreshExecutiveMonitors() {
          try {
            if (pulse) pulse.textContent = 'Live at ' + new Date().toLocaleTimeString() + ' · Executive telemetry active';
          } catch (e) {
            if (pulse) pulse.textContent = 'Monitor sync degraded';
          }
        }

        if (new URLSearchParams(window.location.search).get('autoproof') === '1') {
          // bootstrapMediaProof only on demand
          try { document.body.classList.add('titanium-ui'); } catch (e) {}
        }

        refreshExecutiveMonitors();
        setInterval(refreshExecutiveMonitors, 30000);
      })();
    </script>
  </body>
</html>
