<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVICS Executive Command Workspace</title>
    <meta name="description" content="EVICS executive command workspace with live operational monitors." />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="media-output.css" />
    <link rel="stylesheet" href="vp-executive-assistant.css" />
    <style>
      #evics-boot-splash {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 60vh; color: #eff5fb; gap: 18px; padding: 40px;
      }
      #evics-boot-splash .splash-logo {
        display: grid; place-items: center; width: 56px; height: 56px; border-radius: 10px;
        background: linear-gradient(135deg, #f0d898 0%, #d9bf7a 55%, #9a7a32 100%);
        color: #070b11; font-weight: 900; font-size: 18px; letter-spacing: -0.5px;
        box-shadow: 0 0 22px rgba(217,191,122,.3);
      }
      #evics-boot-splash .splash-title { font-size: 18px; font-weight: 700; color: #eff5fb; }
      #evics-boot-splash .splash-sub { font-size: 12px; color: #90a4bb; letter-spacing: 0.08em; text-transform: uppercase; }
      #evics-boot-splash .splash-spinner {
        width: 28px; height: 28px; border: 3px solid rgba(0,199,245,.15);
        border-top-color: #00c7f5; border-radius: 50%; animation: evics-spin 0.8s linear infinite;
      }
      @keyframes evics-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="exec-shell-body">

    <header class="exec-shell-header">
      <div class="exec-shell-brand">
        <span class="exec-mark">EVICS</span>
        <div>
          <strong>I AM GENESIS TECH</strong>
          <small>ELITE VIRAL INTELLIGENCE CONTROL SYSTEM</small>
        </div>
      </div>
      <nav class="exec-shell-nav">
        <a href="/workspace" aria-current="page">EVICS</a>
        <a href="/viral-media">Viral Media</a>
        <a href="/affiliate">Affiliate Hub</a>
        <a href="/phone-app">Phone App</a>
        <a href="/admin-hub">Affiliate AdminHub</a>
        <a href="/discoverability">SEO Grader</a>
      </nav>
      <div class="exec-shell-pulse" id="evicsPulse">Initializing live monitors…</div>
    </header>

    <main class="exec-shell-main">
      <div id="evics-boot-splash">
        <div class="splash-logo">EVICS</div>
        <div class="splash-title">I AM GENESIS TECH</div>
        <div class="splash-sub">Elite Viral Intelligence Control System</div>
        <div class="splash-spinner"></div>
        <div class="splash-sub" id="evics-boot-status">Loading workspace…</div>
      </div>
      <div id="app"></div>
    </main>

    <!--
      Boot Controller: runs BEFORE app.js.
      Defers boot() so the splash screen paints first.
      Intercepts console.error to show EVICS errors on screen.
    -->
    <script>
    (function() {
      var __bootFunc = null;
      var __bootIntercepted = false;

      try {
        Object.defineProperty(window, 'boot', {
          configurable: true,
          enumerable: true,
          get: function() {
            if (__bootFunc && !__bootIntercepted) {
              __bootIntercepted = true;
              var realBoot = __bootFunc;
              return function deferredBoot() {
                var s = document.getElementById('evics-boot-status');
                if (s) s.textContent = 'Initializing workspace\u2026';
                setTimeout(function() {
                  try { realBoot(); } catch(e) { window.__showEvicsError('boot() error: ' + e.message); }
                }, 50);
              };
            }
            return __bootFunc;
          },
          set: function(fn) { __bootFunc = fn; }
        });
      } catch(e) { /* defineProperty not supported, boot runs normally */ }

      var origError = console.error;
      console.error = function() {
        origError.apply(console, arguments);
        var msg = Array.prototype.join.call(arguments, ' ');
        if (msg.indexOf('[EVICS]') >= 0 || msg.indexOf('Render error') >= 0 || msg.indexOf('boot() error') >= 0) {
          window.__showEvicsError(msg);
        }
      };

      window.__showEvicsError = function(msg) {
        var panel = document.getElementById('evics-error-panel');
        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'evics-error-panel';
          panel.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#1a1a2e;color:#ff5a68;font:12px/1.6 monospace;padding:16px;max-height:50vh;overflow:auto;border-bottom:3px solid #ff5a68;';
          var h = document.createElement('h3');
          h.textContent = 'EVICS Error';
          h.style.cssText = 'color:#ff5a68;margin:0 0 8px;font-size:14px;';
          panel.appendChild(h);
          document.body.insertBefore(panel, document.body.firstChild);
          var splash = document.getElementById('evics-boot-splash');
          if (splash) splash.style.display = 'none';
        }
        var line = document.createElement('div');
        line.textContent = String(msg);
        line.style.cssText = 'margin-bottom:4px;word-break:break-all;';
        panel.appendChild(line);
      };

      window.onerror = function(msg, src, line) {
        window.__showEvicsError('Uncaught: ' + msg + ' at ' + (src||'?') + ':' + line);
      };
    })();
    </script>

    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="media-output.js"></script>
    <script src="workspace-boot-shims.js"></script>
    <script src="app.js"></script>
    <script src="workspace-boot-fix.js"></script>
    <script src="vp-executive-assistant.js"></script>
    <script src="vp-board-command-guard.js"></script>

    <script>
    (function() {
      var pulse = document.getElementById('evicsPulse');

      function checkMounted() {
        var app = document.getElementById('app');
        return app && app.children.length > 0;
      }

      // 10s recovery: if workspace is empty, attempt direct render
      setTimeout(function() {
        if (checkMounted()) return;

        if (window.__evicsRenderers && typeof renderWorkspaceShell === 'function') {
          try {
            var html = renderWorkspaceShell();
            if (html && html.length > 100) {
              var app = document.getElementById('app');
              app.innerHTML = html;
              try { bindEvents(); } catch(e) {}
              var splash = document.getElementById('evics-boot-splash');
              if (splash) splash.style.display = 'none';
              return;
            }
          } catch(e) {
            window.__showEvicsError('Recovery renderWorkspaceShell: ' + e.message);
          }
        }

        if (typeof render === 'function') {
          try {
            render();
            if (checkMounted()) return;
          } catch(e) {
            window.__showEvicsError('Recovery render(): ' + e.message);
          }
        }

        var status = document.getElementById('evics-boot-status');
        if (status) {
          status.innerHTML = '<span style="color:#ff5a68">Workspace timed out</span><br>' +
            '<button id="evics-retry-btn" style="margin-top:12px;padding:8px 20px;background:#00c7f5;color:#070b11;border:0;border-radius:6px;font-weight:700;cursor:pointer;">Retry</button>';
          var btn = document.getElementById('evics-retry-btn');
          if (btn) btn.onclick = function() {
            status.textContent = 'Retrying\u2026';
            try { render(); } catch(e) { status.textContent = 'Error: ' + e.message; }
          };
        }
      }, 10000);

      setTimeout(function() {
        if (typeof state !== 'undefined' && state.dataSource === 'Demo' && typeof hydrateFromServerApi === 'function') {
          hydrateFromServerApi().then(function() {
            if (typeof render === 'function') render();
          }).catch(function() {});
        }
      }, 15000);

      function refreshPulse() {
        try {
          if (pulse) pulse.textContent = 'Live at ' + new Date().toLocaleTimeString() + ' \u00b7 Executive telemetry active';
        } catch(e) {}
      }

      if (new URLSearchParams(window.location.search).get('autoproof') === '1') {
        try { document.body.classList.add('titanium-ui'); } catch(e) {}
      }

      refreshPulse();
      setInterval(refreshPulse, 30000);
    })();
    </script>
  </body>
</html>
